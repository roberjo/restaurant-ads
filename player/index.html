<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen Player</title>
  <style>
    :root { --brand: #2563eb; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; cursor: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #stage > img, #stage > video { width: 100%; height: 100%; object-fit: contain; }
    #debug { position: fixed; bottom: 0.6vw; right: 1vw; color: #888; font-size: 0.8vw; }

    .pair { text-align: center; }
    .pair h1 { font-size: 2.4vw; font-weight: 500; margin: 0 0 2vw; color: #ccc; }
    .pair .code { font: 700 9vw/1 ui-monospace, Menlo, monospace; letter-spacing: 0.15em; color: #fff;
      padding: 1.5vw 3vw; border: 0.3vw solid var(--brand); border-radius: 1.5vw; display: inline-block; }
    .pair p { font-size: 1.6vw; color: #999; margin-top: 2.4vw; }

    .menu { position: absolute; inset: 0; padding: 3.5vw 4.5vw; box-sizing: border-box; display: flex; flex-direction: column; }
    .menu.dark { background: #111; color: #f5f5f5; }
    .menu.light { background: #faf7f2; color: #1c1917; }
    .menu.brand { background: var(--brand); color: #fff; }
    .menu h1 { font-size: 4.2vw; margin: 0 0 2.5vw; letter-spacing: -0.02em; }
    .menu .cols { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 4vw; flex: 1; align-content: start; }
    .menu h2 { font-size: 2.2vw; margin: 0 0 1.2vw; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.75;
      border-bottom: 0.15vw solid currentColor; padding-bottom: 0.6vw; }
    .menu .item { display: flex; justify-content: space-between; gap: 2vw; margin-bottom: 1.3vw; }
    .menu .name { font-size: 2vw; font-weight: 600; }
    .menu .desc { font-size: 1.25vw; opacity: 0.7; margin-top: 0.2vw; }
    .menu .price { font-size: 2vw; font-weight: 700; white-space: nowrap; }
    .menu .sold { opacity: 0.4; }
    .menu .sold .name { text-decoration: line-through; }
    .menu .badge { font-size: 1vw; font-weight: 700; border: 0.12vw solid currentColor; border-radius: 0.4vw;
      padding: 0.1vw 0.5vw; margin-left: 0.8vw; vertical-align: middle; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="debug" hidden></div>
  <script src="player.js"></script>
</body>
</html>
